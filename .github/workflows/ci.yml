name: local checks

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install .[dev]
          python -m pip uninstall -y sourcequorum
      - run: python -m pytest
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy --strict src
      - run: python -m build --no-isolation
      - run: python -m pytest tests/test_distribution_members.py tests/test_synthetic_example.py
      - run: |
          audit_root="$(mktemp -d)"
          git archive HEAD | tar -x -C "$audit_root"
          python "$audit_root/scripts/audit_release.py" "$audit_root" \
            --register "$audit_root/dependency-register.json" \
            --sbom "$audit_root/sbom.cdx.json" \
            --artifact "$PWD/dist/sourcequorum-0.1.1-py3-none-any.whl" \
            --artifact "$PWD/dist/sourcequorum-0.1.1.tar.gz"
